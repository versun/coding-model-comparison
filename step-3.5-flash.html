<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force-Directed Graph - D3.js + React</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
      body {
        background: #0a0a0a;
        color: #e5e5e5;
        margin: 0;
        overflow: hidden;
      }

      .graph-container {
        position: relative;
        background: radial-gradient(circle at 20% 50%, #111 0%, #0a0a0a 100%);
      }

      .node {
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .node:hover {
        filter: brightness(1.5);
      }

      .link {
        opacity: 0.2;
        stroke: #3a7bd5;
        transition: opacity 0.3s ease;
      }

      .tooltip {
        position: absolute;
        padding: 8px 12px;
        background: rgba(20, 20, 30, 0.95);
        border: 1px solid #3a7bd5;
        border-radius: 8px;
        font-size: 12px;
        color: #fff;
        pointer-events: none;
        z-index: 1000;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(58, 123, 213, 0.3);
        transition: opacity 0.2s ease;
      }

      svg {
        width: 100%;
        height: 100%;
      }

      /* Custom scrollbar for details panel */
      .details-panel::-webkit-scrollbar {
        width: 6px;
      }

      .details-panel::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      .details-panel::-webkit-scrollbar-thumb {
        background: rgba(58, 123, 213, 0.5);
        border-radius: 3px;
      }

      .details-panel::-webkit-scrollbar-thumb:hover {
        background: rgba(58, 123, 213, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      // Generate random graph data
      const generateGraphData = () => {
        const nodeCount = 100;
        const nodes = Array.from({ length: nodeCount }, (_, i) => ({
          id: i,
          group: Math.floor(Math.random() * 5),
          value: Math.random() * 30 + 10
        }));

        const links = [];
        for (let i = 0; i < nodeCount * 1.5; i++) {
          const source = Math.floor(Math.random() * nodeCount);
          const target = Math.floor(Math.random() * nodeCount);
          if (source !== target) {
            links.push({ source, target });
          }
        }

        return { nodes, links };
      };

      // Color scale for node groups
      const getColorScale = () => {
        return d3.scaleOrdinal()
          .domain([0, 1, 2, 3, 4])
          .range(['#3a7bd5', '#00d9ff', '#ff6b9d', '#ffd93d', '#6bcb77']);
      };

      const ForceGraph = () => {
        const svgRef = useRef(null);
        const [graphData, setGraphData] = useState(null);
        const [selectedNode, setSelectedNode] = useState(null);
        const [hoveredNode, setHoveredNode] = useState(null);
        const [tooltip, setTooltip] = useState({ visible: false, x: 0, y: 0 });
        const [transform, setTransform] = useState({ k: 1, x: 0, y: 0 });
        const [isDragging, setIsDragging] = useState(false);
        const dragStart = useRef({ x: 0, y: 0 });

        // Initialize data
        useEffect(() => {
          setGraphData(generateGraphData());
        }, []);

        // Build simulation
        const simulation = useMemo(() => {
          if (!graphData) return null;

          const sim = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(80))
            .force('charge', d3.forceManyBody().strength(-200))
            .force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2 - 60))
            .force('collision', d3.forceCollide().radius(d => d.value + 5).iterations(2));

          sim.alphaDecay(0.02);
          sim.velocityDecay(0.3);

          return sim;
        }, [graphData]);

        // Handle zoom
        const handleWheel = useCallback((e) => {
          e.preventDefault();
          const scaleFactor = 1.1;
          const delta = e.deltaY > 0 ? 1 / scaleFactor : scaleFactor;
          const newScale = Math.max(0.1, Math.min(5, transform.k * delta));

          const rect = svgRef.current.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          const newX = mouseX - (mouseX - transform.x) * (newScale / transform.k);
          const newY = mouseY - (mouseY - transform.y) * (newScale / transform.k);

          setTransform({ k: newScale, x: newX, y: newY });
        }, [transform]);

        // Handle pan drag
        const handleMouseDown = useCallback((e) => {
          if (e.button === 0 && !e.target.closest('.node')) {
            setIsDragging(true);
            dragStart.current = { x: e.clientX - transform.x, y: e.clientY - transform.y };
          }
        }, [transform]);

        const handleMouseMove = useCallback((e) => {
          if (isDragging) {
            setTransform({
              ...transform,
              x: e.clientX - dragStart.current.x,
              y: e.clientY - dragStart.current.y
            });
          }
        }, [isDragging, transform]);

        const handleMouseUp = useCallback(() => {
          setIsDragging(false);
        }, []);

        // Global mouse move for panning
        useEffect(() => {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseup', handleMouseUp);
          };
        }, [handleMouseMove, handleMouseUp]);

        // Highlight connected nodes
        const getConnectedNodeIds = (nodeId) => {
          if (!graphData) return new Set();
          const connected = new Set([nodeId]);
          graphData.links.forEach(link => {
            if (link.source.id === nodeId || link.source === nodeId) {
              connected.add(link.target.id || link.target);
            }
            if (link.target.id === nodeId || link.target === nodeId) {
              connected.add(link.source.id || link.source);
            }
          });
          return connected;
        };

        const highlightedIds = selectedNode ? getConnectedNodeIds(selectedNode.id) : new Set();

        return (
          <div className="graph-container relative w-full h-screen">
            {/* Header */}
            <div className="absolute top-0 left-0 right-0 p-6 z-10">
              <h1 className="text-2xl font-bold text-white mb-1">Force-Directed Graph</h1>
              <p className="text-gray-400 text-sm">100 nodes | Interactive visualization</p>
            </div>

            {/* Controls hint */}
            <div className="absolute bottom-6 left-6 z-10 text-xs text-gray-500">
              <div>Scroll to zoom</div>
              <div>Drag to pan</div>
              <div>Click node to highlight connections</div>
            </div>

            {/* Details Panel */}
            <div className={`absolute top-24 right-6 w-72 bg-gray-900/80 backdrop-blur-md rounded-xl p-6 border
  border-gray-800/50 details-panel overflow-y-auto transition-all duration-300 ${selectedNode ? 'opacity-100' : 'opacity-0
  pointer-events-none'}`}>
              <h3 className="text-white font-semibold mb-4 text-lg">Node Details</h3>
              {selectedNode && (
                <div className="space-y-3">
                  <div>
                    <div className="text-gray-500 text-xs uppercase tracking-wider">ID</div>
                    <div className="text-white font-mono">#{selectedNode.id}</div>
                  </div>
                  <div>
                    <div className="text-gray-500 text-xs uppercase tracking-wider">Group</div>
                    <div className="text-white">
                      <span className="inline-block px-2 py-1 text-xs rounded" style={{ backgroundColor:
  getColorScale()(selectedNode.group) + '30', color: getColorScale()(selectedNode.group) }}>
                        Group {selectedNode.group}
                      </span>
                    </div>
                  </div>
                  <div>
                    <div className="text-gray-500 text-xs uppercase tracking-wider">Value</div>
                    <div className="text-white">{selectedNode.value.toFixed(2)}</div>
                  </div>
                  <div>
                    <div className="text-gray-500 text-xs uppercase tracking-wider">Connections</div>
                    <div className="text-white">
                      {graphData.links.filter(
                        l => (l.source.id === selectedNode.id) || (l.source === selectedNode.id) ||
                             (l.target.id === selectedNode.id) || (l.target === selectedNode.id)
                      ).length} edges
                    </div>
                  </div>
                  <div className="pt-3 border-t border-gray-800">
                    <button
                      onClick={() => setSelectedNode(null)}
                      className="w-full py-2 text-sm text-gray-400 hover:text-white hover:bg-gray-800/50 rounded
  transition-colors"
                    >
                      Clear selection
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* SVG */}
            <svg
              ref={svgRef}
              onWheel={handleWheel}
              onMouseDown={handleMouseDown}
              style={{ cursor: isDragging ? 'grabbing' : 'grab' }}
            >
              <g transform={`translate(${transform.x}, ${transform.y}) scale(${transform.k})`}>
                <defs>
                  <marker
                    id="arrowhead"
                    markerWidth="10"
                    markerHeight="7"
                    refX="20"
                    refY="3.5"
                    orient="auto"
                    opacity="0.3"
                  >
                    <polygon points="0 0, 10 3.5, 0 7" fill="#3a7bd5" />
                  </marker>
                </defs>

                {graphData && simulation && (
                  <g className="links">
                    {graphData.links.map((link, i) => {
                      const source = link.source;
                      const target = link.target;
                      const isHighlighted = selectedNode &&
                        (
                          (source.id === selectedNode.id || source === selectedNode) ||
                          (target.id === selectedNode.id || target === selectedNode)
                        );

                      return (
                        <line
                          key={i}
                          className="link"
                          x1={source.x}
                          y1={source.y}
                          x2={target.x}
                          y2={target.y}
                          stroke={isHighlighted ? '#3a7bd5' : '#1a3a5c'}
                          strokeWidth={isHighlighted ? 2 : 1}
                          strokeOpacity={isHighlighted ? 0.6 : 0.15}
                          markerEnd="url(#arrowhead)"
                        />
                      );
                    })}
                  </g>
                )}

                {graphData && simulation && (
                  <g className="nodes">
                    {graphData.nodes.map(node => {
                      const isHovered = hoveredNode?.id === node.id;
                      const isSelected = selectedNode?.id === node.id;
                      const inHighlightedSet = highlightedIds.has(node.id);

                      let radius = node.value;
                      if (isHovered) radius *= 1.3;
                      if (isSelected) radius *= 1.4;
                      if (selectedNode && !inHighlightedSet) {
                        radius *= 0.5;
                      }

                      return (
                        <g
                          key={node.id}
                          className="node"
                          transform={`translate(${node.x}, ${node.y})`}
                          onMouseEnter={(e) => {
                            setHoveredNode(node);
                            const rect = svgRef.current.getBoundingClientRect();
                            setTooltip({
                              visible: true,
                              x: e.clientX - rect.left + 15,
                              y: e.clientY - rect.top - 10
                            });
                          }}
                          onMouseMove={(e) => {
                            const rect = svgRef.current.getBoundingClientRect();
                            setTooltip({
                              ...tooltip,
                              x: e.clientX - rect.left + 15,
                              y: e.clientY - rect.top - 10
                            });
                          }}
                          onMouseLeave={() => {
                            setHoveredNode(null);
                            setTooltip({ ...tooltip, visible: false });
                          }}
                          onClick={() => setSelectedNode(node)}
                        >
                          <circle
                            r={radius}
                            fill={getColorScale()(node.group)}
                            fillOpacity={selectedNode && !inHighlightedSet ? 0.2 : 0.7}
                            stroke={isSelected ? '#fff' : getColorScale()(node.group)}
                            strokeWidth={isSelected ? 3 : isHovered ? 2 : 0}
                            style={{
                              filter: isSelected ? 'drop-shadow(0 0 10px currentColor)' : none,
                              transition: 'all 0.2s ease'
                            }}
                          />
                          {isHovered && (
                            <text
                              textAnchor="middle"
                              dy=".35em"
                              fill="#fff"
                              fontSize="10"
                              fontWeight="bold"
                              style={{ pointerEvents: 'none', textShadow: '0 1px 2px rgba(0,0,0,0.8)' }}
                            >
                              {node.id}
                            </text>
                          )}
                        </g>
                      );
                    })}
                  </g>
                )}
              </g>
            </svg>

            {/* Tooltip */}
            {tooltip.visible && hoveredNode && (
              <div
                className="tooltip"
                style={{
                  left: tooltip.x,
                  top: tooltip.y,
                  opacity: tooltip.visible ? 1 : 0
                }}
              >
                <div className="font-semibold text-blue-400 mb-1">Node #{hoveredNode.id}</div>
                <div className="text-xs space-y-1">
                  <div>Group: <span style={{ color: getColorScale()(hoveredNode.group) }}>{hoveredNode.group}</span></div>
                  <div>Connections: {
                    graphData.links.filter(
                      l => (l.source.id === hoveredNode.id) || (l.source === hoveredNode) ||
                           (l.target.id === hoveredNode.id) || (l.target === hoveredNode)
                    ).length
                  }</div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const App = () => (
        <div className="w-full h-full">
          <ForceGraph />
        </div>
      );

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
  </html>
